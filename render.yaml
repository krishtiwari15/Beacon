# render.yaml — defines Beacon's full deployment: database + backend + frontend.
# Render reads this to build and run all three services automatically.

databases:
  - name: beacon-db
    plan: free
    databaseName: beacon
    user: beacon

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: beacon-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beacon-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false        # we set this secret manually in the dashboard
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ---- Frontend: Streamlit ----
  - type: web
    name: beacon-frontend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: API_URL
        sync: false        # we set this to the backend URL after backend deploys
      - key: PYTHON_VERSION
        value: "3.12.0"